<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Turn a device description into structured product filters.">
    <title>Device Filter Classifier</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <section class="composer" aria-labelledby="prompt-title">
        <div class="composer-heading">
          <div>
            <p class="step">01 / Describe</p>
            <h2 id="prompt-title">What are you looking for?</h2>
          </div>
          <span class="shortcut">⌘ / Ctrl + Enter</span>
        </div>
        <form id="classify-form">
          <label class="sr-only" for="prompt">Device description</label>
          <textarea id="prompt" name="prompt" maxlength="10000" rows="5"
            placeholder="e.g. An industrial cold-chain tracker with LTE-M, Bluetooth 5.2 and eSIM…"
            required></textarea>
          <div class="actions">
            <button class="primary" id="submit"
              type="submit"><span>Classify prompt</span><span aria-hidden="true">→</span></button>
            <button class="secondary" id="clear" type="button">Clear</button>
            <p id="status" role="status"
              aria-live="polite">Ready for a device description.</p>
          </div>
        </form>
      </section>

      <section class="results" aria-labelledby="results-title">
        <div class="section-heading">
          <div>
            <p class="step">02 / Explore</p>
            <h2 id="results-title">Filter catalog</h2>
          </div>
          <div id="result-count" class="result-count">No matches yet</div>
        </div>
        <div id="error" class="error" role="alert" hidden></div>
        <div id="catalog" class="catalog" aria-busy="true"></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
